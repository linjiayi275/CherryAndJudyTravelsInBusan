     - .stop-card / .stop-field / .field-label / .field-value（itinerary-full.css）

  <section class="dep-section">

      <div class="entity-title-row">

        <a class="entity-link-icon" href="https://www.roc-taiwan.org/kr/contact_us.html" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-link"></i>
        </a>
      </div>
      <div class="stop-field"><span class="field-label">電話</span><span class="field-value">82-2-6329-6000</span></div>
      <div class="stop-field">
        <span class="field-label">信箱</span>

    <div class="stop-card dep-card">

        </a>
      </div>
      <div class="stop-field"><span class="field-label">電話</span><span class="field-value">82-10-9080-2761</span></div>

          <i class="fa-solid fa-link"></i>
        </a>
      </div>
      <div class="stop-field"><span class="field-label">電話</span><span class="field-value">1330（24 小時中文服務）</span></div>
